name: Build and Deploy to ECS

on:
  workflow_dispatch:

env:
  AWS_ACCOUNT_ID: 184967710807
  ECR_REPOSITORY: rails-template-dev
  CONTAINER_NAME: web

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image-tag: ${{ steps.image.outputs.tag }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions-build
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          secrets: |
            RAILS_MASTER_KEY=${{ secrets.RAILS_MASTER_KEY }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Export image tag
        id: image
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        region:
          - us-east-1
          - eu-west-1
        include:
          - region: us-east-1
            cluster: rails-template-dev-cluster
            service: rails-template-dev-service
          - region: eu-west-1
            cluster: rails-template-dev-cluster
            service: rails-template-dev-service
            
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions-deploy-${{ matrix.region }}
          aws-region: ${{ matrix.region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Copy image to regional ECR
        run: |
          SOURCE_IMAGE="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ needs.build.outputs.image-tag }}"
          TARGET_IMAGE="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ needs.build.outputs.image-tag }}"
          
          # Crear repositorio si no existe
          aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY }} --region ${{ matrix.region }} 2>/dev/null || \
          aws ecr create-repository --repository-name ${{ env.ECR_REPOSITORY }} --region ${{ matrix.region }}
          
          # Copiar imagen usando ECR replication o re-tag
          if [ "${{ matrix.region }}" != "us-east-1" ]; then
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
            docker pull $SOURCE_IMAGE
            docker tag $SOURCE_IMAGE $TARGET_IMAGE
            docker push $TARGET_IMAGE
          fi

      - name: Render regional task definition
        run: |
          sed -e "s|us-east-1|${{ matrix.region }}|g" \
              -e "s|184967710807.dkr.ecr.us-east-1.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest|${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ needs.build.outputs.image-tag }}|g" \
              ecs/task-definition.json > task-definition-${{ matrix.region }}.json

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: task-definition-${{ matrix.region }}.json
          service: ${{ matrix.service }}
          cluster: ${{ matrix.cluster }}
          wait-for-service-stability: true
